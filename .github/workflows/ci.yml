name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Julia
        uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1"

      - name: Check formatting with Runic
        uses: fredrikekre/runic-action@b4dbd650db5cc684baae27fea45d22daf41693c2 # v1.5.0
        with:
          version: "1"

  test:
    name: Julia ${{ matrix.version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.version == 'pre' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # `min` is the oldest Julia allowed by Project.toml; `1` is the latest release.
        version: ["min", "1"]
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          # Early warning from the next Julia release; failures do not fail the run.
          - version: "pre"
            os: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Julia
        uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: ${{ matrix.version }}

      - name: Cache Julia dependencies
        uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          delete-old-caches: "false"

      - name: Instantiate and precompile the package
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Test the package and check package quality
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.test()'

      - name: Smoke test the package entry point
        run: julia --startup-file=no --project=. -m TemplateJulia Ada

      - name: Install the command-line app
        run: |
          julia --startup-file=no -e 'using Pkg; Pkg.Apps.develop(path=pwd())'
          julia --startup-file=no -e 'println(joinpath(first(DEPOT_PATH), "bin"))' >> "$GITHUB_PATH"

      # PowerShell finds the app's .bat launcher on Windows and its shell launcher elsewhere.
      - name: Smoke test the installed app
        shell: pwsh
        run: template-julia Ada

      - name: Smoke test the package from a separate environment
        run: |
          julia --startup-file=no -e '
            using Pkg
            repository = pwd()
            Pkg.activate(mktempdir())
            Pkg.develop(path=repository)
            using TemplateJulia
            @assert line(-1.0, 1.0; num=3) == [-1.0, 0.0, 1.0]
            print_hello("Ada")
          '

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Julia
        uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1"

      - name: Cache Julia dependencies
        uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          delete-old-caches: "false"

      - name: Install development tools
        run: julia --startup-file=no --project=build_tools -e 'using Pkg; Pkg.instantiate()'

      - name: Test with coverage
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.test(coverage=true)'

      - name: Require full source line coverage
        run: julia --startup-file=no --project=build_tools build_tools/coverage.jl

      - name: Save the coverage report
        if: always() && hashFiles('lcov.info') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: lcov.info
